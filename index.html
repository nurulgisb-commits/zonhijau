function newSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a);}
async function hashPw(pw,saltHex){
  var salt=Uint8Array.from(saltHex.match(/../g).map(function(h){return parseInt(h,16);}));
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},key,256));
}
async function checkPw(pw){return !!S.admin&&(await hashPw(pw,S.admin.salt))===S.admin.hash;}
function hasCrypto(){return typeof crypto!=='undefined'&&crypto.subtle&&crypto.getRandomValues;}

}
function setMsg(t){msg=t||'';var el=document.getElementById('msg');if(el)el.textContent=msg||defaultMsg();}
function updateBar(){
  var sb=document.getElementById('savebtn'),db=document.getElementById('discardbtn');
  if(sb)sb.disabled=!dirty||busy;
  if(db)db.hidden=!dirty;
  setMsg(msg);
}
function markDirty(){if(!dirty){dirty=true;msg='';}updateBar();}
function fail(err){
  var c=err&&err.code;
  var t='Gagal menyimpan. Perubahan anda masih ada di skrin, cuba lagi.';
  if(c==='conflict')t='Laman baru dikemas kini oleh orang lain. Memuatkan versi terkini...';
  else if(c==='not_writer'||c==='not_granted'||c==='not_declared')t='Anda tidak mempunyai kebenaran Editor untuk mengubah laman ini.';
  else if(c==='too_large')t='Fail terlalu besar.';
  else if(c==='unsupported_type')t='Format fail tidak disokong. Poster: JPG, PNG atau WebP. Video: MP4 atau WebM.';
  else if(c==='rate_limited')t='Terlalu laju. Tunggu sebentar kemudian cuba lagi.';
  else if(c==='quota_or_state')t='Ruang simpanan penuh.';
  setMsg(t);
}

function goTo(i){
  var n=slideList().length;if(n<2)return;
  cur=((i%n)+n)%n;
  app.querySelectorAll('.sl').forEach(function(el,k){el.classList.toggle('on',k===cur);el.setAttribute('aria-hidden',k===cur?'false':'true');});
  app.querySelectorAll('.hero .bg').forEach(function(el,k){el.classList.toggle('on',k===cur&&el.style.backgroundImage!=='');});
  app.querySelectorAll('.sdot').forEach(function(el,k){if(k===cur)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
}
function stopSlides(){if(timer){clearInterval(timer);timer=null;}}
function startSlides(){
  stopSlides();
  var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(slideList().length>1&&!adminOn&&!reduce)timer=setInterval(function(){goTo(cur+1);},6500);
}

function armed(b,fn,label){
  if(b.dataset.armed){fn();return;}
  b.dataset.armed='1';var old=b.textContent;b.textContent=label||'Tekan lagi untuk padam';
  setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent=old;}},3500);
}

async function save(extra){
  if(busy)return;
  collect();cleanup();
  busy=true;setMsg('Menyimpan...');updateBar();
  try{if(extra)extra();await artifact.publish(pageSource());}
  catch(err){busy=false;fail(err);render();}
}

/* ---------- peristiwa ---------- */
app.addEventListener('click',function(e){
  if(e.target.id==='lb'){e.target.close();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(act==='zoom'){document.getElementById('lbi').src=b.dataset.src;document.getElementById('lbi').alt=b.dataset.title;document.getElementById('lbt').textContent=b.dataset.title;document.getElementById('lb').showModal();}
  else if(act==='closelb'){document.getElementById('lb').close();}
  else if(act==='enter'){
    if(!hasCrypto()){setMsg('Pelayar ini tidak menyokong kata laluan selamat. Cuba pelayar lain.');return;}
    if(!S.admin){gate='setup';render();}
    else if(sess('zh_ok')==='1'){adminOn=true;sess('zh_on','1');render();}
    else{gate='unlock';render();}
  }
  else if(act==='gateclose'){gate=null;render();}
  else if(act==='chgpw'){gate=gate==='change'?null:'change';collect();render();}
  else if(act==='save'){save();}
  else if(act==='discard'){armed(b,function(){S=JSON.parse(SAVED);dirty=false;msg='';render();},'Tekan lagi untuk buang');}
  else if(act==='exit'){
    var out=function(){if(dirty)S=JSON.parse(SAVED);dirty=false;adminOn=false;gate=null;msg='';sess('zh_on',null);sess('zh_ok',null);render();};
    if(dirty)armed(b,out,'Ada perubahan, tekan lagi');else out();
  }
  else if(act==='addnews'){var nid=uid();stage(function(){S.news.unshift({id:nid,date:today(),title:'',body:'',urgent:false});},'news.'+nid+'.title');}
  else if(act==='addevent'){var eid=uid();stage(function(){S.events.push({id:eid,day:'',mon:'',title:'',place:''});},'events.'+eid+'.day');}
  else if(act==='addcontact'){var cid=uid();stage(function(){S.contacts.push({id:cid,label:'',value:'',tel:''});},'contacts.'+cid+'.label');}
  else if(act==='delposter'){armed(b,function(){stage(function(){S.posters=S.posters.filter(function(p){return p.id!==id;});});});}
  else if(act==='delnews'){armed(b,function(){stage(function(){S.news=S.news.filter(function(n){return n.id!==id;});});});}
  else if(act==='slide'){goTo(+b.dataset.i);startSlides();}
  else if(act==='prevslide'){goTo(cur-1);startSlides();}
  else if(act==='nextslide'){goTo(cur+1);startSlides();}
  else if(act==='addslide'){var sid=uid();stage(function(){S.slides.push({id:sid,title:'',body:'',asset:''});},null);var sf=app.querySelector('[data-in="slides.'+sid+'.title"]');if(sf){sf.scrollIntoView({block:'center'});sf.focus();}}
  else if(act==='delslide'){armed(b,function(){stage(function(){S.slides=S.slides.filter(function(n){return n.id!==id;});});});}
  else if(act==='rmslideimg'){stage(function(){var s=S.slides.filter(function(x){return x.id===id;})[0];if(s)s.asset='';});}
  else if(act==='addad'){var aid0=uid();stage(function(){S.ads.unshift({id:aid0,name:'',desc:'',wa:'',asset:''});},'ads.'+aid0+'.name');}
  else if(act==='delajk'){armed(b,function(){stage(function(){S.ajk=S.ajk.filter(function(n){return n.id!==id;});});});}
  else if(act==='delad'){armed(b,function(){stage(function(){S.ads=S.ads.filter(function(n){return n.id!==id;});});});}
  else if(act==='delvideo'){armed(b,function(){stage(function(){S.videos=S.videos.filter(function(n){return n.id!==id;});});});}
  else if(act==='delevent'){armed(b,function(){stage(function(){S.events=S.events.filter(function(n){return n.id!==id;});});});}
  else if(act==='delcontact'){armed(b,function(){stage(function(){S.contacts=S.contacts.filter(function(n){return n.id!==id;});});});}
});
app.addEventListener('input',function(e){if(e.target.matches&&e.target.matches('[data-f],[data-in]'))markDirty();});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-slfile]')){
    var sfile=t.files[0];if(!sfile)return;
    if(!assets){setMsg('Muat naik gambar tidak tersedia pada paparan ini.');return;}
    var sid2=t.dataset.slfile;setMsg('Memuat naik gambar slaid...');
    assets.upload(sfile).then(function(r){
      stage(function(){var s=S.slides.filter(function(x){return x.id===sid2;})[0];if(s)s.asset=r.id;});
    },function(err){fail(err);});
    return;
  }
  if(t.matches&&t.matches('[data-adfile]')){
    var file=t.files[0];if(!file)return;
    if(!assets){setMsg('Muat naik gambar tidak tersedia pada paparan ini.');return;}
    var aid=t.dataset.adfile;setMsg('Memuat naik gambar iklan...');
    assets.upload(file).then(function(r){
      stage(function(){var a=S.ads.filter(function(x){return x.id===aid;})[0];if(a)a.asset=r.id;});
    },function(err){fail(err);});
    return;
  }
  if(t.matches&&t.matches('[data-in]'))markDirty();
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.line&&e.target.dataset.f)e.preventDefault();});
app.addEventListener('paste',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');if(!el)return;
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData('text/plain');
  if(el.dataset.line)t=t.replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,t);
});
app.addEventListener('mouseover',function(e){if(e.target.closest&&e.target.closest('.hero'))stopSlides();});
app.addEventListener('mouseout',function(e){var h=e.target.closest&&e.target.closest('.hero');if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))startSlides();});
app.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('.hero')){tx=e.touches[0].clientX;stopSlides();}},{passive:true});
app.addEventListener('touchend',function(e){if(tx!==null){var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)goTo(cur+(dx<0?1:-1));startSlides();}},{passive:true});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

app.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  var btn=f.querySelector('button[type=submit]');
  if(f.id==='f'){
    var d=new FormData(f);
    var t='Aduan/Cadangan ('+d.get('jenis')+')\nNama: '+d.get('nama')+'\nRumah: '+d.get('rumah')+'\n'+d.get('butiran');
    var wa=String(S.wa||'').replace(/\D/g,'');
    window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(t),'_blank','noopener');
  }else if(f.id==='pf'){
    var file=f.elements.file.files[0];if(!file)return;
    if(!assets){setMsg('Muat naik gambar tidak tersedia pada paparan ini.');return;}
    var title=(f.elements.ptitle.value||'').trim()||file.name.replace(/\.[^.]+$/,'');
    btn.disabled=true;setMsg('Memuat naik poster...');
    assets.upload(file).then(function(r){
      stage(function(){S.posters.unshift({id:uid(),title:title,asset:r.id});});
    },function(err){fail(err);btn.disabled=false;});
  }else if(f.id==='af'){
    var af=f.elements.afile.files[0];if(!af)return;
    if(!assets){setMsg('Muat naik gambar tidak tersedia pada paparan ini.');return;}
    var at=(f.elements.atitle.value||'').trim();
    btn.disabled=true;setMsg('Memuat naik gambar...');
    assets.upload(af).then(function(r){
      stage(function(){S.ajk.push({id:uid(),title:at,asset:r.id});});
    },function(err){fail(err);btn.disabled=false;});
  }else if(f.id==='vf'){
    var vfile=f.elements.vfile.files[0];if(!vfile)return;
    if(!assets){setMsg('Muat naik video tidak tersedia pada paparan ini.');return;}
    if(vfile.size>20*1024*1024){setMsg('Video terlalu besar ('+Math.round(vfile.size/1048576)+' MB). Had ialah 20 MB. Mampatkan atau pendekkan video dahulu.');return;}
    var vtitle=(f.elements.vtitle.value||'').trim()||vfile.name.replace(/\.[^.]+$/,'');
    btn.disabled=true;setMsg('Memuat naik video, sila tunggu...');
    assets.upload(vfile).then(function(r){
      stage(function(){S.videos.unshift({id:uid(),title:vtitle,asset:r.id});});
    },function(err){fail(err);btn.disabled=false;});
  }else if(f.id==='gs'){
    var p1=f.elements.p1.value,p2=f.elements.p2.value;
    if(p1!==p2){setMsg('Kata laluan tidak sama. Taip semula.');return;}
    if(p1.length<8){setMsg('Kata laluan mesti sekurang-kurangnya 8 aksara.');return;}
    btn.disabled=true;setMsg('Menetapkan kata laluan...');
    (async function(){
      try{
        var salt=newSalt();var h=await hashPw(p1,salt);
        sess('zh_ok','1');sess('zh_on','1');
        S.admin={salt:salt,hash:h};
        await artifact.publish(pageSource());
      }catch(err){S.admin=null;sess('zh_ok',null);sess('zh_on',null);fail(err);btn.disabled=false;}
    })();
  }else if(f.id==='gu'){
    btn.disabled=true;setMsg('Menyemak...');
    checkPw(f.elements.p.value).then(function(ok){
      if(ok){sess('zh_ok','1');sess('zh_on','1');adminOn=true;gate=null;msg='';render();}
      else{setTimeout(function(){setMsg('Kata laluan salah.');btn.disabled=false;f.elements.p.value='';f.elements.p.focus();},800);}
    });
  }else if(f.id==='gc'){
    var q1=f.elements.p1.value,q2=f.elements.p2.value;
    if(q1!==q2){setMsg('Kata laluan baharu tidak sama.');return;}
    btn.disabled=true;setMsg('Menyemak...');
    (async function(){
      try{
        if(!(await checkPw(f.elements.p0.value))){setMsg('Kata laluan semasa salah.');btn.disabled=false;return;}
        var salt=newSalt();var h=await hashPw(q1,salt);
        await save(function(){S.admin={salt:salt,hash:h};});
      }catch(err){fail(err);btn.disabled=false;}
    })();
  }
});

render();
(async function(){
  try{
    if(typeof claude==='undefined')return;
    var u=await claude.use('user');
    var a=await claude.use('artifact');
    if(u&&a&&await u.canEdit()){canAdmin=true;artifact=a;assets=await claude.use('assets');}
  }catch(err){canAdmin=false;}
  if(canAdmin){
    if(S.admin&&sess('zh_ok')==='1'&&sess('zh_on')==='1')adminOn=true;
    render();
  }
})();
})();
</script>
